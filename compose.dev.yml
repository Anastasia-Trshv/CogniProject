services:
  rabbitmq:
    image: "rabbitmq:management"
    restart: always
    ports:
      - "5003:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s

  postgres:
    image: "postgres:latest"
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cogni
    ports:
      - "5004:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d cogni"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s

  redis:
    image: redis:7.2.4-alpine
    restart: always
    ports:
      - "5002:6379"
    command:
      [
        "redis-server",
        "--requirepass", "password",
        "--user", "user", "on", ">password", "~*", "allcommands",
        "--user", "default", "off", "nopass", "nocommands"
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "user", "-a", "password", "ping"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s

  minio:
    image: minio/minio
    restart: always
    environment:
      MINIO_HOST: "http://minio:9000"
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
      BUCKET_NAME: "chat-files"
    entrypoint: ["/bin/sh", "/data/init.sh"]
    ports:
      - "9000:9000"
    volumes:
      - ./minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s

  dev_cogni:
    build:
      context: .
      dockerfile: ./Cogni/Dockerfile.dev
    restart: always
    command: ["run"]
    environment:
      MIGRATE: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 5279:5279
    volumes:
      - ./Cogni:/src/Cogni
      - ./Shared:/src/Shared
      - ./dockerized.secrets.json:/src/Cogni/secrets.json
  dev_chat_service:
    build:
      context: .
      dockerfile: ./ChatService/Dockerfile.dev
    ports:
      - 5108:5108
    image: chat-backend
    restart: always
    entrypoint: ["sh", "-c"]
    command: ["sleep 45; exec dotnet run"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./ChatService:/src/ChatService
      - ./Shared:/src/Shared
      - ./dockerized.secrets.json:/src/ChatService/secrets.json
  dev_chat_frontend:
    build:
      context: ./ChatDevFrontend
      dockerfile: Dockerfile.dev
    restart: always
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_DOCKER_DEV=true
    ports:
      - 5173:5173
    develop:
      watch:
        - action: sync
          path: ./ChatDevFrontend
          target: /app

volumes:
  redis_data:
